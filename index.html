<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuktha Priya Masupalli | Full-Stack & AI Developer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM CDNs -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Babel CDN -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- GSAP CDN for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .fade-in { opacity: 0; transform: translateX(-50px); }
        .fade-in-right { opacity: 0; transform: translateX(50px); }
        .fade-in.visible, .fade-in-right.visible { opacity: 1; transform: translateX(0); }
        .navbar { transition: background-color 0.3s ease; }
        .navbar.scrolled { background-color: rgba(255, 255, 255, 0.95); }
        .card { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1); }
        .active-nav { border-bottom: 2px solid #2563eb; }
        .project-card { opacity: 0; transform: translateX(-20px); }
        .project-card.visible { opacity: 1; transform: translateX(0); }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Portfolio = () => {
            const [filter, setFilter] = useState('all');
            const [activeSection, setActiveSection] = useState('home');

            const projects = [
                { id: 1, title: 'Rust System Programming Vulnerabilities Detection', category: 'AI', description: 'Built a system using ML and static analysis to detect Rust vulnerabilities, leveraging its type system for memory safety.', link: 'https://github.com/yukthapriya/rust-vulnerabilities-detection', image: 'rust-vulnerabilities.jpg' },
                { id: 2, title: 'University Recommendation System', category: 'Full-Stack', description: 'Developed a Flask app with Neo4j and KNN for personalized university recommendations based on GPA and rankings.', link: 'https://github.com/yukthapriya/university-recommendation-system', image: 'university-recommendation.jpg' },
                { id: 3, title: 'Healthcare Monitoring & Diabetes Prediction', category: 'AI', description: 'Created a web app using NLP and classification for diabetes prediction, with a responsive UI and SQLite backend.', link: 'https://github.com/yukthapriya/healthcare-monitoring-system', image: 'healthcare-monitoring.jpg' },
                { id: 4, title: 'MOODINTELLECT.AI', category: 'AI', description: 'Real-time facial emotion recognition using MediaPipe and CNN (FER-2013 dataset) for online learning and mental health.', link: 'https://github.com/yukthapriya/moodintellect', image: 'moodintellect.jpg' },
            ];

            const filteredProjects = filter === 'all' ? projects : projects.filter(p => p.category === filter);

            useEffect(() => {
                // GSAP Animations for Sections
                gsap.registerPlugin(ScrollTrigger);
                gsap.utils.toArray('.fade-in').forEach((element, index) => {
                    gsap.fromTo(element, { opacity: 0, x: index % 2 === 0 ? -50 : 50 }, {
                        opacity: 1,
                        x: 0,
                        duration: 0.8,
                        scrollTrigger: { trigger: element, start: 'top 80%' }
                    });
                });

                // GSAP Animations for Project Cards
                const animateProjects = () => {
                    gsap.utils.toArray('.project-card').forEach((card, i) => {
                        gsap.fromTo(card, { opacity: 0, x: -20 }, {
                            opacity: 1,
                            x: 0,
                            duration: 0.5,
                            delay: i * 0.1,
                            scrollTrigger: { trigger: card, start: 'top 90%' }
                        });
                    });
                };
                animateProjects();

                // Active nav highlighting
                const sections = document.querySelectorAll('section[id]');
                const observer = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            setActiveSection(entry.target.id);
                        }
                    });
                }, { threshold: 0.5 });
                sections.forEach(section => observer.observe(section));

                // Navbar scroll effect
                const handleScroll = () => {
                    const navbar = document.querySelector('.navbar');
                    if (window.scrollY > 50) {
                        navbar.classList.add('scrolled');
                    } else {
                        navbar.classList.remove('scrolled');
                    }
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, [filter]);

            const handleSubmit = (e) => {
                e.preventDefault();
                console.log('Form submitted:', {
                    name: e.target.name.value,
                    email: e.target.email.value,
                    message: e.target.message.value
                });
                alert('Message logged to console (GitHub Pages does not support backend).');
                e.target.reset();
            };

            return (
                <div>
                    {/* Navigation Bar */}
                    <nav className="navbar fixed top-0 left-0 w-full bg-white bg-opacity-80 backdrop-blur-md z-50">
                        <div className="container mx-auto px-4 py-4 flex justify-between items-center">
                            <a href="#home" className="text-xl font-bold text-blue-600">Yuktha Priya</a>
                            <div className="space-x-4">
                                {['home', 'about', 'education', 'skills', 'experience', 'projects', 'learning', 'collaboration', 'publications', 'connect'].map(section => (
                                    <a
                                        key={section}
                                        href={`#${section}`}
                                        className={`hover:text-blue-600 transition ${activeSection === section ? 'active-nav' : ''}`}
                                    >
                                        {section.charAt(0).toUpperCase() + section.slice(1)}
                                    </a>
                                ))}
                            </div>
                        </div>
                    </nav>

                    {/* Home/Hero Section */}
                    <section id="home" className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-200 to-indigo-200">
                        <div className="text-center fade-in">
                            <h1 className="text-5xl md:text-6xl font-bold mb-4">Yuktha Priya Masupalli</h1>
                            <p className="text-xl md:text-2xl mb-6">Full-Stack Developer & AI Researcher</p>
                            <div className="space-x-4">
                                <a href="#projects" className="inline-block px-6 py-3 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition">View Projects</a>
                            </div>
                        </div>
                    </section>

                    {/* Main Content */}
                    <main className="container mx-auto px-4 pt-20">
                        {/* About */}
                        <section id="about" className="py-12 fade-in">
                            <div className="card bg-white p-6 rounded-lg shadow-lg">
                                <h2 className="text-3xl font-semibold mb-4">About Me</h2>
                                {/* Uncomment if profile.jpg is uploaded */}
                                {/* <img src="profile.jpg" alt="Yuktha Priya Masupalli" className="w-32 h-32 rounded-full mx-auto mb-4" loading="lazy" /> */}
                                <p className="text-lg">
                                    Master's student at Texas A&M University-San Antonio, specializing in AI, data engineering, and full-stack development. I craft scalable, secure systems and research multimodal AI, LLMs, and graph databases. Active in GDSC and Women Techmakers, I'm driven to innovate with AI.
                                </p>
                            </div>
                        </section>

                        {/* Education */}
                        <section id="education" className="py-12 fade-in-right">
                            <div className="card bg-white p-6 rounded-lg shadow-lg">
                                <h2 className="text-3xl font-semibold mb-4">Education</h2>
                                <ul className="space-y-4">
                                    <li>
                                        <strong>Texas A&M University-San Antonio</strong>, San Antonio, USA<br />
                                        MS in Computer Science, GPA: 3.87/4.0, Aug 2024 - Dec 2025
                                    </li>
                                    <li>
                                        <strong>JNTUA College of Engineering</strong>, Kalikiri, India<br />
                                        B.Tech in Computer Science, GPA: 8.1/10, Nov 2020 - May 2023
                                    </li>
                                    <li>
                                        <strong>S.V Govt. Polytechnic</strong>, Tirupati, India<br />
                                        Diploma in Computer Engineering, 93.6/100, Jun 2017 - Apr 2020
                                    </li>
                                </ul>
                            </div>
                        </section>

                        {/* Skills */}
                        <section id="skills" className="py-12 fade-in">
                            <div className="card bg-white p-6 rounded-lg shadow-lg">
                                <h2 className="text-3xl font-semibold mb-4">Key Skills</h2>
                                <div className="flex flex-wrap gap-2">
                                    {['Python', 'JavaScript', 'Rust', 'ReactJS', 'NodeJS', 'Django', 'TensorFlow', 'Pytorch', 'Keras', 'AWS', 'GCP', 'Azure', 'PostgreSQL', 'MongoDB', 'Neo4j', 'Kubernetes', 'Git'].map(skill => (
                                        <span key={skill} className="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm">{skill}</span>
                                    ))}
                                </div>
                            </div>
                        </section>

                        {/* Experience */}
                        <section id="experience" className="py-12 fade-in-right">
                            <div className="card bg-white p-6 rounded-lg shadow-lg">
                                <h2 className="text-3xl font-semibold mb-4">Experience</h2>
                                <ul className="space-y-6">
                                    <li>
                                        <strong>Texas A&M University-San Antonio</strong>, Graduate Research Assistant, Feb 2025 – May 2025<br />
                                        Developed a cross-domain retrieval system with CLIP, optimized pipelines (20% latency reduction), and fine-tuned LLMs and diffusion models for multimodal AI. Built audio-video analysis for JagCoach AI on GCP.
                                    </li>
                                    <li>
                                        <strong>Digitalsoft AI Solutions</strong>, Associate Data Engineer, Chennai, India, Jul 2023 - Jun 2024<br />
                                        Designed scalable UI with AngularJS, integrated APIs with AWS, researched recommendation systems, and built GenAI chat assistants with LangChain and LLMs.
                                    </li>
                                </ul>
                            </div>
                        </section>

                        {/* Projects */}
                        <section id="projects" className="py-12 fade-in">
                            <div className="card bg-white p-6 rounded-lg shadow-lg">
                                <h2 className="text-3xl font-semibold mb-4">Projects</h2>
                                <div className="flex space-x-4 mb-4">
                                    <button onClick={() => setFilter('all')} className={`px-4 py-2 rounded-full ${filter === 'all' ? 'bg-blue-600 text-white' : 'bg-blue-100 text-blue-800'}`}>All</button>
                                    <button onClick={() => setFilter('AI')} className={`px-4 py-2 rounded-full ${filter === 'AI' ? 'bg-blue-600 text-white' : 'bg-blue-100 text-blue-800'}`}>AI</button>
                                    <button onClick={() => setFilter('Full-Stack')} className={`px-4 py-2 rounded-full ${filter === 'Full-Stack' ? 'bg-blue-600 text-white' : 'bg-blue-100 text-blue-800'}`}>Full-Stack</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {filteredProjects.map(project => (
                                        <div key={project.id} className="card bg-gray-50 p-4 rounded-lg project-card">
                                            <img src={project.image} alt={project.title} className="w-full h-40 object-cover rounded-lg mb-4" loading="lazy" onError={e => e.target.src = 'https://via.placeholder.com/300x150?text=Project+Image'} />
                                            <h3 className="text-xl font-semibold">{project.title}</h3>
                                            <p className="text-sm text-gray-600">{project.description}</p>
                                            <a href={project.link} className="text-blue-600 hover:underline mt-2 inline-block">GitHub</a>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </section>
                        {/* Currently Learning */}
                        <section id="learning" className="py-12 fade-in-right">
                            <div className="card bg-white p-6 rounded-lg shadow-lg">
                                <h2 className="text-3xl font-semibold mb-4">Currently Learning</h2>
                                <ul className="space-y-2">
                                    <li>Agentic AI for autonomous decision-making systems</li>
                                    <li>Generative AI for innovative content creation</li>
                                    <li>Multimodal AI integrating vision, language, and audio</li>
                                    <li>Large Language Models (LLMs) for advanced NLP</li>
                                    <li>Natural Language Processing (NLP) for text analysis</li>
                                    <li>Computer Vision (CV) for image and video processing</li>
                                    <li>Cloud Infrastructure & DevOps (AWS, GCP, Azure, Kubernetes)</li>
                                    <li>Graph Databases (Neo4j) for advanced analytics</li>
                                </ul>
                            </div>
                        </section>

                        {/* Collaboration */}
                        <section id="collaboration" className="py-12 fade-in">
                            <div className="card bg-white p-6 rounded-lg shadow-lg">
                                <h2 className="text-3xl font-semibold mb-4">Looking to Collaborate On</h2>
                                <ul className="space-y-2">
                                    <li>Open-source ML, AI, and software engineering projects</li>
                                    <li>AI-cybersecurity tools and platforms</li>
                                    <li>Vision-language models and secure networking research</li>
                                </ul>
                            </div>
                        </section>

                        {/* Publications */}
                        <section id="publications" className="py-12 fade-in-right">
                            <div className="card bg-white p-6 rounded-lg shadow-lg">
                                <h2 className="text-3xl font-semibold mb-4">Publications</h2>
                                <ul className="space-y-2">
                                    <li>
                                        <strong>Benchmarking the Robustness of Contrastive Learning Models for Medical Image-Report Retrieval</strong><br />
                                        AAAI Workshop. <a href="https://doi.org/10.48550/arXiv.2501.09134" className="text-blue-600 hover:underline">arXiv</a>
                                    </li>
                                    <li>
                                        <strong>Improving Medical Imaging Model Calibration through Probabilistic Embedding</strong><br />
                                        IEEE Big Data Conference. <a href="https://ieeexplore.ieee.org/document/10908492" className="text-blue-600 hover:underline">IEEE Xplore</a>
                                    </li>
                                </ul>
                            </div>
                        </section>

                        {/* Connect & Contact */}
                        <section id="connect" className="py-12 fade-in">
                            <div className="card bg-white p-6 rounded-lg shadow-lg">
                                <h2 className="text-3xl font-semibold mb-4">Connect With Me</h2>
                                <ul className="space-y-2 mb-6">
                                    <li><a href="https://www.linkedin.com/in/yukthapriya" className="text-blue-600 hover:underline">LinkedIn</a></li>
                                    <li><a href="https://github.com/yukthapriya" className="text-blue-600 hover:underline">GitHub</a></li>
                                  
                                </ul>
                                <h2 className="text-3xl font-semibold mb-4">Contact</h2>
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <div>
                                        <label htmlFor="name" className="block text-sm">Name</label>
                                        <input id="name" name="name" type="text" required className="w-full px-4 py-2 bg-gray-50 text-gray-900 rounded-lg border border-gray-300" />
                                    </div>
                                    <div>
                                        <label htmlFor="email" className="block text-sm">Email</label>
                                        <input id="email" name="email" type="email" required className="w-full px-4 py-2 bg-gray-50 text-gray-900 rounded-lg border border-gray-300" />
                                    </div>
                                    <div>
                                        <label htmlFor="message" className="block text-sm">Message</label>
                                        <textarea id="message" name="message" required className="w-full px-4 py-2 bg-gray-50 text-gray-900 rounded-lg border border-gray-300"></textarea>
                                    </div>
                                    <button type="submit" className="px-6 py-3 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition">Send</button>
                                </form>
                                <p className="mt-4 text-sm text-gray-600">Or email: <a href="mailto:myukthapriya@gmail.com" className="text-blue-600 hover:underline">myukthapriya@gmail.com</a></p>
                            </div>
                        </section>
                    </main>

                    {/* Footer */}
                    <footer className="bg-gradient-to-br from-blue-200 to-indigo-200 text-center py-6">
                        <p>&copy; 2025 Yuktha Priya Masupalli. All rights reserved.</p>
                    </footer>
                </div>
            );
        };

        ReactDOM.render(<Portfolio />, document.getElementById('root'));
    </script>
</body>
</html>
